#!/bin/bash
set -e

# ===================== 配置区域 =====================
# 请填写你的阿里云信息
ALIYUN_REGISTRY="registry.cn-hangzhou.aliyuncs.com"          # 改成你的 Registry 地址
ALIYUN_NAME_SPACE="your-namespace"                           # 改成你的命名空间
ALIYUN_REGISTRY_USER="your-username"                         # 阿里云账号 / RAM用户
ALIYUN_REGISTRY_PASSWORD="your-fixed-password"               # ACR 固定密码（不是阿里云登录密码）

IMAGES_FILE="images.txt"                                     # 镜像列表文件
# ===================================================

echo "========================================"
echo "开始登录阿里云镜像仓库"
echo "========================================"

echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
  -u "$ALIYUN_REGISTRY_USER" \
  --password-stdin \
  "$ALIYUN_REGISTRY"

echo "登录成功！"
echo ""

# 检测重名镜像
declare -A duplicate_images
declare -A temp_map

while IFS= read -r line || [ -n "$line" ]; do
  [[ -z "$line" ]] && continue
  if echo "$line" | grep -q '^\s*#'; then
    continue
  fi

  image=$(echo "$line" | awk '{print $NF}')
  image="${image%%@*}"
  image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
  name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
  name_space="${name_space}_"
  image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

  if [[ -n "${temp_map[$image_name]}" ]]; then
    if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
      echo "发现重名镜像: $image_name"
      duplicate_images[$image_name]="true"
    fi
  else
    temp_map[$image_name]=$name_space
  fi
done < "$IMAGES_FILE"

echo "========================================"
echo "开始拉取并推送镜像"
echo "========================================"

while IFS= read -r line || [ -n "$line" ]; do
  [[ -z "$line" ]] && continue
  if echo "$line" | grep -q '^\s*#'; then
    continue
  fi

  echo ""
  echo ">>> 处理: $line"
  docker pull $line

  platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
  if [ -z "$platform" ]; then
    platform_prefix=""
  else
    platform_prefix="${platform//\//_}_"
  fi

  image=$(echo "$line" | awk '{print $NF}')
  image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
  name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
  image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

  name_space_prefix=""
  if [[ -n "${duplicate_images[$image_name]}" ]]; then
    if [[ -n "${name_space}" ]]; then
      name_space_prefix="${name_space}_"
    fi
  fi

  image_name_tag="${image_name_tag%%@*}"
  new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

  echo ">>> 打标签: $new_image"
  docker tag $image $new_image

  echo ">>> 推送中..."
  docker push $new_image

  # 可选：推送后清理本地镜像（节省磁盘）
  # docker rmi $image $new_image || true

  echo ">>> 完成: $new_image"
done < "$IMAGES_FILE"

echo ""
echo "========================================"
echo "全部完成！"
echo "========================================"
